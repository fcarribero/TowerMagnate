name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build art
        run: pnpm art:build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Snapshot save benchmark
        run: pnpm bench:snapshots

      - name: Transport graph benchmark
        run: pnpm bench:graph

      - name: People layer benchmark
        run: pnpm bench:people-layer

      - name: Trek step benchmark
        run: pnpm bench:trek

      - name: Office tower week benchmark
        run: pnpm bench:office-week

      - name: Security events benchmark
        run: pnpm bench:events

      - name: Venue customers benchmark
        run: pnpm bench:customers

  e2e:
    name: End-to-end tests
    if: (github.event_name == 'pull_request' && github.base_ref == 'develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHOKIDAR_USEPOLLING: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build art
        run: pnpm art:build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e against the compose stack
        run: pnpm e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            e2e/test-results
            playwright-report
          retention-days: 7

  e2e-prod:
    name: End-to-end tests on the production build
    if: startsWith(github.ref_name, 'release/') || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_PROFILE: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e against the production image
        run: pnpm e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-prod-traces
          path: |
            e2e/test-results
            playwright-report
          retention-days: 7
